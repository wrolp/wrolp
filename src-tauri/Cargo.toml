[package]
name = "wrolp-terminal"
version = "0.0.4"
edition = "2021"
license = "MIT"
default-run = "wrolp-terminal"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
dirs = "6"
log = "0.4"
simplelog = "0.12"
russh = "0.44"
russh-keys = "0.44"
russh-sftp = "2"
async-trait = "0.1"
encoding_rs = "0.8"
portable-pty = "0.8"
anyhow = "1"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

[[bin]]
name = "wrolp-terminal"
path = "src/main.rs"

[[bin]]
name = "ssh_test"
path = "src/ssh_test.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
